services:
  - type: web
    name: binorylogy-physics
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_DATASET_REPO
        value: Explorerp/binorylogy-physics-memory
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: PORT
        value: "10000"
    autoDeploy: true
